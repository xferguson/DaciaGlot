name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel an in-flight Pages deploy on main; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          if [ -d test ]; then node --test; else echo "No tests yet"; fi
      - name: Validate content
        run: |
          if [ -f scripts/validate-content.mjs ]; then node scripts/validate-content.mjs; else echo "No content validator yet"; fi

      - name: Content coverage report
        run: |
          if [ -f scripts/validate-content.mjs ]; then node scripts/validate-content.mjs --coverage | sed -n '/^## Content coverage/,$p' >> "$GITHUB_STEP_SUMMARY"; fi
      # Enable once T23 lands (Stages 1-2 complete): fails if any A1 can-do or pattern is below target.
      # - name: Strict A1 coverage
      #   run: node scripts/validate-content.mjs --strict-a1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
