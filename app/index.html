<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaciaGlot</title>
  <style>
    :root { --bg: #fbf8f3; --fg: #1d1b18; --muted: #6b655c; --accent: #1f4e9c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16150f; --fg: #ece8e1; --muted: #a39d93; --accent: #8fb3ff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { padding: 24px 16px; max-width: 32rem; text-align: center; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; color: var(--accent); }
    p { margin: .5rem 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>DaciaGlot</h1>
    <p lang="ro">În curând — o aplicație pentru a vorbi românește.</p>
    <p>Coming soon: a Romanian speaking-practice app. The deployment pipeline is working.</p>
  </main>
</body>
</html>
